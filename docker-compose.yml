services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://clauseiq:clauseiq@db:5432/clauseiq
      MAX_UPLOAD_MB: "10"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clauseiq
      POSTGRES_PASSWORD: clauseiq
      POSTGRES_DB: clauseiq
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clauseiq -d clauseiq"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
